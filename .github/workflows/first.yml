name: My workflow

on:
  push:

jobs:
  ascii_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: List repo
        run: ls -ltra

      - name: Make script executable
        run: chmod +x ascii.sh

      - name: Execute shell script
        run: ./ascii.sh